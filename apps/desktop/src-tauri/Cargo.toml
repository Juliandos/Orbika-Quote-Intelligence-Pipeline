[package]
name = "orbika-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.7", features = ["custom-protocol"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
