services:
  orbika-postgres:
    image: pgvector/pgvector:pg16
    container_name: orbika-postgres
    environment:
      POSTGRES_DB: ${ORBIKA_POSTGRES_DB:-orbika_local}
      POSTGRES_USER: ${ORBIKA_POSTGRES_USER:-orbika}
      POSTGRES_PASSWORD: ${ORBIKA_POSTGRES_PASSWORD:-change-me}
    volumes:
      - orbika_postgres_data:/var/lib/postgresql/data
    networks: [orbika-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORBIKA_POSTGRES_USER:-orbika} -d ${ORBIKA_POSTGRES_DB:-orbika_local}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    restart: unless-stopped

  orbika-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      network: host
    image: orbika-api:latest
    container_name: orbika-api
    env_file:
      - ./secrets/llm.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: "postgresql+psycopg://${ORBIKA_POSTGRES_USER:-orbika}:${ORBIKA_POSTGRES_PASSWORD:-change-me}@orbika-postgres:5432/${ORBIKA_POSTGRES_DB:-orbika_local}"
      ORBIKA_API_STORE: postgres
      ORBIKA_LLM_BASE_URL: ${ORBIKA_LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      ORBIKA_LLM_MODEL: ${ORBIKA_LLM_MODEL:-gemini-flash-lite-latest}
      ORBIKA_INTERNET_SEARCH_ENGINE: ${ORBIKA_INTERNET_SEARCH_ENGINE:-searxng}
      ORBIKA_SEARXNG_URL: http://searxng:8080
      ORBIKA_REDIS_URL: redis://orbika-redis:6379/0
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-*}
      GMAIL_OAUTH_CLIENT_SECRET: /secrets/gmail-client-secret.json
    volumes:
      - ./secrets:/secrets:ro
    networks: [orbika-net, proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orbika-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.orbika-api.entrypoints=web"
      - "traefik.http.routers.orbika-api.priority=100"
      - "traefik.http.services.orbika-api.loadbalancer.server.port=8000"
      - "traefik.docker.network=proxy"
    mem_limit: 2g
    depends_on:
      orbika-postgres:
        condition: service_healthy
    restart: unless-stopped

  orbika-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.pwa
      network: host
    image: orbika-web:latest
    container_name: orbika-web
    networks: [proxy]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orbika-web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.orbika-web.entrypoints=web"
      - "traefik.http.routers.orbika-web.priority=1"
      - "traefik.http.services.orbika-web.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    mem_limit: 128m
    restart: unless-stopped

  orbika-runner:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.runner
      network: host
    image: orbika-runner:latest
    container_name: orbika-runner
    env_file:
      - ./secrets/llm.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: "postgresql://${ORBIKA_POSTGRES_USER:-orbika}:${ORBIKA_POSTGRES_PASSWORD:-change-me}@orbika-postgres:5432/${ORBIKA_POSTGRES_DB:-orbika_local}"
      ORBIKA_LLM_BASE_URL: ${ORBIKA_LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      ORBIKA_LLM_MODEL: ${ORBIKA_LLM_MODEL:-gemini-flash-lite-latest}
      ORBIKA_INTERNET_SEARCH_ENGINE: ${ORBIKA_INTERNET_SEARCH_ENGINE:-searxng}
      ORBIKA_SEARXNG_URL: http://searxng:8080
      ORBIKA_REDIS_URL: redis://orbika-redis:6379/0
      PYTHONPATH: /workspace
      PYTHONUNBUFFERED: "1"
      ORBIKA_PROVIDER_CATALOG_SOURCE: db
    volumes:
      - ./secrets:/secrets
      - orbika_runner_data:/data
      - ./supplier_catalog:/workspace/supplier_catalog:ro
    networks: [orbika-net, proxy]
    mem_limit: 3g
    depends_on:
      orbika-postgres:
        condition: service_healthy
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - ./searxng:/etc/searxng:rw
    networks: [orbika-net]
    mem_limit: 512m
    restart: unless-stopped

  orbika-redis:
    image: redis:7-alpine
    container_name: orbika-redis
    command: redis-server --save 60 1 --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks: [orbika-net]
    mem_limit: 320m
    restart: unless-stopped

networks:
  orbika-net:
  proxy:
    external: true

volumes:
  orbika_postgres_data:
  orbika_runner_data:
